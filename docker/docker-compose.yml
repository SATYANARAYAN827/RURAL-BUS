version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ruralbus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruralbus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      APP_DB_USER: ruralbus_app
      APP_DB_PASSWORD: app_secure_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ruralbus']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ruralbus-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
